# ============================================================
# SIH26153 — AI-Based Network Attack Forecasting
# Counterfactual Cyber World Model — Docker Compose
# ============================================================

services:
  # ── Development server ──────────────────────────────────
  dev:
    build:
      context: .
      target: development
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - .:/app
      - dev-data:/app/data
    environment:
      - FLASK_DEBUG=1
      - PORT=5000
      - NW_WORLD_MODEL=lstm
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/dashboard')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Pipeline runner (one-shot) ──────────────────────────
  pipeline:
    build:
      context: .
      target: development
    volumes:
      - dev-data:/app/data
    environment:
      - NW_WORLD_MODEL=lstm
    command: python run.py --pipeline-only
    profiles:
      - pipeline

  # ── Production server ───────────────────────────────────
  prod:
    build:
      context: .
      target: production
    ports:
      - "${PROD_PORT:-8000}:5000"
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-me-in-production}
      - PORT=5000
    volumes:
      - prod-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/dashboard')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

volumes:
  dev-data:
    driver: local
  prod-data:
    driver: local
