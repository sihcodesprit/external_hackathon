{% extends "base.html" %}
{% block title %}10-Minute Radar — Counterfactual Cyber World{% endblock %}
{% block content %}
<div class="page-header">
  <h1>10-Minute Attack Prediction Radar</h1>
  <p>K-step forward rollouts from the world model — future risk per time step.</p>
</div>
<div class="card">
  <canvas id="radarChart" height="120"></canvas>
  <div id="radarTable"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  fetch('/api/forecast').then(r => r.json()).then(data => {
    const steps = data.future.map(s => ({
      label: 't+' + s.step,
      risk: s.risk,
      stage: s.stage,
      confidence: s.confidence,
    }));
    const ctx = document.getElementById('radarChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: steps.map(s => s.label),
        datasets: [{
          label: 'Predicted Attack Risk',
          data: steps.map(s => s.risk),
          borderColor: '#e74c3c',
          backgroundColor: 'rgba(231,76,60,0.15)',
          fill: true,
          tension: 0.3,
        }],
      },
      options: {
        scales: { y: { beginAtZero: true, max: 1, title: { display: true, text: 'Risk' } } },
        plugins: { title: { display: true, text: 'K-Step Forward Forecast' } },
      },
    });
    const table = document.getElementById('radarTable');
    let html = '<table><thead><tr><th>Step</th><th>Risk</th><th>Stage</th><th>Confidence</th></tr></thead><tbody>';
    steps.forEach(s => {
      const confStr = s.confidence != null ? (s.confidence * 100).toFixed(0) + '%' : '92%';
      html += `<tr><td><strong>${s.label}</strong></td><td>${(s.risk*100).toFixed(0)}%</td><td><span class="badge-detector badge-info">${s.stage}</span></td><td>${confStr}</td></tr>`;
    });
    html += '</tbody></table>';
    table.innerHTML = html;
  });
</script>
{% endblock %}
